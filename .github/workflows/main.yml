name: Build Link Downloader APK

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/link_downloader_app/**"
      - "main.py"
      - "link_downloader.kv"
      - "buildozer.spec"
      - "requirements.txt"
      - ".github/workflows/link-downloader-android.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            unzip \
            zip

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython virtualenv

      - name: Find app folder
        id: app
        shell: bash
        run: |
          if [ -f "tools/link_downloader_app/buildozer.spec" ]; then
            echo "dir=tools/link_downloader_app" >> "$GITHUB_OUTPUT"
          elif [ -f "buildozer.spec" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "Could not find buildozer.spec."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.app.outputs.dir }}
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: link-downloader-apk
          path: |
            tools/link_downloader_app/bin/*.apk
            bin/*.apk


