name: Build Link Downloader APK

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/link_downloader_app/**"
      - ".github/workflows/link-downloader-android.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            openjdk-17-jdk \
            unzip \
            zip

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython virtualenv

      - name: Build debug APK
        working-directory: tools/link_downloader_app
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: link-downloader-apk
          path: tools/link_downloader_app/bin/*.apk
